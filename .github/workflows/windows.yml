name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: windows/requirements-build.txt
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Unit tests and real local download with official yt-dlp
        env:
          YTDLP_INTEGRATION: '1'
          YTDLP_TEST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Test Windows falliti' }
      - name: Verify GUI on Windows
        run: |
          python main.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Test interfaccia fallito' }
      - name: Build portable application
        run: |
          python tools/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Build fallita' }
      - name: Verify packaged executable
        run: |
          $p = Start-Process -FilePath ./dist/YtDlp.exe -ArgumentList '--smoke-test' -PassThru
          if (!$p.WaitForExit(60000)) { Stop-Process -Id $p.Id; throw 'Timeout app compilata' }
          if ($p.ExitCode -ne 0) { throw "App compilata fallita: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: YtDlp-Windows-x64
          path: |
            windows/dist/YtDlp-Windows-x64.zip
            windows/dist/YtDlp-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish a new Windows version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = python -c 'from ytdlp_windows import VERSION; print(VERSION)'
          $tag = "windows-v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag già presente: pubblicazione saltata."
            exit 0
          }
          gh release create $tag ./dist/YtDlp-Windows-x64.zip ./dist/YtDlp-Windows-x64.zip.sha256 --target $env:GITHUB_SHA --title "YtDlp Windows $version" --notes-file RELEASE_NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Pubblicazione release fallita' }
